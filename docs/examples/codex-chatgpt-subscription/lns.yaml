apiVersion: lns.run/v1
kind: Sandbox
metadata:
  name: codex-chatgpt-subscription
spec:
  image: docker.io/curlimages/curl:latest
  command: sh -lc "export PATH=$HOME/.local/bin:$PATH; mkdir -p $HOME/.codex $HOME/.local/bin; [ -f $HOME/.codex/config.toml ] || cp /opt/codex-seed/.codex/config.toml $HOME/.codex/config.toml; command -v codex >/dev/null || { arch=$(uname -m); curl -fsSL https://github.com/openai/codex/releases/latest/download/codex-$arch-unknown-linux-musl.tar.gz | tar -xzf - -C $HOME/.local/bin; mv $HOME/.local/bin/codex-$arch-unknown-linux-musl $HOME/.local/bin/codex; }; exec codex"
  workdir: /workspace
  env:
    SHELL: "/bin/sh"
  resources:
    cpu: 4
    memory: 6Gi
  ports:
    - container: 1455
  policy:
    defaultVerdict: ask
    allowedRoutes:
      - match: github.com
        verdict: allow
      - match: release-assets.githubusercontent.com
        verdict: allow
      - match: auth.openai.com
        verdict: allow
      - match: chatgpt.com
        verdict: allow
      - match: api.openai.com
        verdict: allow
  volumes:
    - type: bind
      source: .
      target: /workspace
    - type: volume
      source: codex-home
      target: /home/curl_user
  filesets:
    - path: ./config
      mountPath: /opt/codex-seed
