apiVersion: lns.run/v1
kind: sandbox
name: claude-code
spec:
  image: docker.io/library/debian:bookworm-slim
  tools:
    - node@22
  # Not a login shell: debian's /etc/profile resets PATH unconditionally, which would discard the declared tools' bin dirs before this line runs.
  command: sh -c "export PATH=$HOME/.npm-global/bin:$PATH; command -v claude >/dev/null || npm install --silent --prefix $HOME/.npm-global -g @anthropic-ai/claude-code; exec claude"
  workdir: /workspace
  env:
    SHELL: "/bin/sh"
    CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    DISABLE_AUTOUPDATER: "1"
    DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"
    CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: "1"
    DISABLE_ERROR_REPORTING: "1"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
  resources:
    cpu: 4
    memory: 6Gi
  egress:
    http:
      - match: registry.npmjs.org
        verdict: allow
      - match: api.anthropic.com
        verdict: allow
      - match: platform.claude.com
        verdict: allow
      - match: downloads.claude.ai
        verdict: allow
  volumes:
    - type: bind
      source: .
      target: /workspace
  filesets:
    - inline:
        .claude.json: |
          {
            "hasCompletedOnboarding": true,
            "theme": "dark",
            "projects": {
              "/workspace": {
                "hasTrustDialogAccepted": true
              }
            }
          }
        .claude/settings.json: |
          {
            "permissions": {
              "defaultMode": "bypassPermissions"
            },
            "skipDangerousModePermissionPrompt": true,
            "skipAutoPermissionPrompt": true,
            "sandbox": {
              "enabled": false
            }
          }
      guestPath: /home/sandbox
