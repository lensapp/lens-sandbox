apiVersion: lns.run/v1
kind: Sandbox
metadata:
  name: codex
spec:
  image: docker.io/library/node:lts-alpine
  command: sh -lc "export PATH=$HOME/.npm-global/bin:$PATH; command -v codex >/dev/null || npm install --silent --prefix $HOME/.npm-global -g @openai/codex; exec codex"
  workdir: /workspace
  env:
    SHELL: "/bin/sh"
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
  resources:
    cpu: 4
    memory: 6Gi
  ports:
    - container: 1455
  policy:
    defaultVerdict: ask
    allowedRoutes:
      - match: registry.npmjs.org
        verdict: allow
      - match: auth.openai.com
        verdict: allow
      - match: chatgpt.com
        verdict: allow
      - match: api.openai.com
        verdict: allow
  volumes:
    - type: bind
      source: .
      target: /workspace
  filesets:
    - path: ./config
      mountPath: /home/sandbox
