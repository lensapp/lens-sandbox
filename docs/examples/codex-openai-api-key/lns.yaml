apiVersion: lns.run/v1
kind: Sandbox
metadata:
  name: codex-openai-api-key
spec:
  image: docker.io/curlimages/curl:latest
  command: sh -lc "export PATH=$HOME/.local/bin:$PATH; mkdir -p $HOME/.local/bin; command -v codex >/dev/null || { arch=$(uname -m); curl -fsSL https://github.com/openai/codex/releases/latest/download/codex-$arch-unknown-linux-musl.tar.gz | tar -xzf - -C $HOME/.local/bin; mv $HOME/.local/bin/codex-$arch-unknown-linux-musl $HOME/.local/bin/codex; }; printenv OPENAI_API_KEY | codex login --with-api-key; exec codex"
  workdir: /workspace
  env:
    SHELL: "/bin/sh"
  resources:
    cpu: 4
    memory: 6Gi
  policy:
    defaultVerdict: ask
    allowedRoutes:
      - match: github.com
        verdict: allow
      - match: release-assets.githubusercontent.com
        verdict: allow
      - match: api.openai.com
        verdict: allow
  credentials:
    - name: openai
      env: OPENAI_API_KEY
  volumes:
    - type: bind
      source: .
      target: /workspace
  filesets:
    - path: ./config
      mountPath: /home/curl_user
