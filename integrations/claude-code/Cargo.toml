[workspace]

[package]
name = "lns-cc"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license = "Apache-2.0"
description = "Lens Sandbox bridge for Claude Code: intercepts Bash code execution and routes it into lns microVMs."

[[bin]]
name = "lns-cc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
