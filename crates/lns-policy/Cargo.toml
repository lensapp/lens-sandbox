[package]
name = "lns-policy"
version = "0.0.0"
edition = "2024"
description = "Lens Sandbox policy schema — file format types shared between lns-service (enforcement) and lns-cli (run-summary introspection)"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[dependencies]
lns-spec   = { path = "../lns-spec" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libc       = "0.2"
ipnet      = "2"

[dev-dependencies]
tempfile    = "3"
serial_test = "3"

[lints.clippy]
cognitive_complexity = { level = "deny", priority = 1 }
