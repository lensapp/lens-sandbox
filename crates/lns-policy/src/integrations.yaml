integrations:
  - id: gitlab
    authKind: credential
    routes:
      - match: gitlab.com
    credential:
      envVar: GITLAB_TOKEN
      placeholder: glpat-LNSPLACEHOLDER0000000000000000
      injections:
        - kind: api_key_header
          domain: gitlab.com
          header: PRIVATE-TOKEN
        - kind: bearer_header
          domain: gitlab.com
  - id: huggingface
    authKind: credential
    routes:
      - match: huggingface.co
      - match: "*.huggingface.co"
    credential:
      envVar: HF_TOKEN
      placeholder: hf_LNSPLACEHOLDER0000000000000000000
      injections:
        - kind: bearer_header
          domain: huggingface.co
  - id: github_oauth
    name: GitHub
    authKind: oauth
    routes:
      - match: api.github.com
      - match: github.com
    oauth:
      clientId: 8211c9e2ce69b44ace79
      scopes:
        - repo
        - read:org
      deviceAuthorizationEndpoint: https://github.com/login/device/code
      tokenEndpoint: https://github.com/login/oauth/access_token
      envVar: GH_TOKEN
      placeholder: gho_LNSPLACEHOLDER0000000000000000000000
      injections:
        - kind: token_header
          domain: api.github.com
        - kind: basic_x_access_token
          domain: github.com
    tokenFallback:
      help: https://github.com/settings/personal-access-tokens/new
