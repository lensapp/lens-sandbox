[package]
name = "lns-artifact"
version = "0.1.0"
edition = "2024"
description = "Lens Sandbox typed OCI artifact model — shared spec types, parsers, and producer-side validation"
license = "Apache-2.0"
publish = false

[lib]
name = "lns_artifact"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_yaml = "0.9"
