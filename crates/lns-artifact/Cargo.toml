[package]
name = "lns-artifact"
version = "0.1.0"
edition = "2024"
description = "LNS typed OCI artifact model — shared spec types, parsers, and producer-side validation"
license = "Apache-2.0"
publish = false

[lib]
name = "lns_artifact"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
lns-policy = { path = "../lns-policy" }
lns-spec = { path = "../lns-spec" }
oci-client = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
tar = "0.4"

[dev-dependencies]
serde_yaml = "0.9"
serial_test = "3"
tempfile = "3"
