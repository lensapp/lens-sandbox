[package]
name = "lns-ipc"
version = "0.1.0"
edition = "2024"
description = "IPC contract library for Lens Sandbox — shared Request/Response types and frame codec"
license = "Apache-2.0"
publish = false

[lib]
name = "lns_ipc"
path = "src/lib.rs"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# `io-util` only: gives `AsyncReadExt` for the async frame-reader.
# No runtime / net / time — callers bring their own runtime.
tokio = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints.clippy]
cognitive_complexity = { level = "deny", priority = 1 }

[lints.rust]
unsafe_code = "forbid"
