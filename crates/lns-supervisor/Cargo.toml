[package]
name = "lns-supervisor"
version = "0.1.0"
edition = "2024"
description = "In-guest sandbox supervisor: enforces network policy via an embedded HTTPS proxy + nftables, drops privileges, and supervises the agent workload. Built on lens-sandbox-core."
repository = "https://github.com/lensapp/lens-sandbox"

[[bin]]
name = "lns-supervisor"
path = "src/main.rs"

[dependencies]
# One spelling of the staged script manifest's path and shape, shared with the service that writes it.
lns-session = { path = "../lns-session" }
# Reads the guest's own passwd/group, which lens-sandbox-core's resolver cannot (it needs a same-named group).
nix = { version = "0.29", features = ["user"] }
lens-sandbox-core = { git = "https://github.com/lensapp/lens-sandbox-core", rev = "a0a957862c4af523c837ce30a32030d5d9afff37" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
serial_test = "3"
lns-policy = { path = "../lns-policy" }
