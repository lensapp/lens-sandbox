[package]
name = "lns-supervisor"
version = "0.1.0"
edition = "2024"
description = "In-guest sandbox supervisor using OpenShell networking and process enforcement."
repository = "https://github.com/lensapp/lens-sandbox"

[[bin]]
name = "lns-supervisor"
path = "src/openshell.rs"

[dependencies]
# One spelling of the staged script manifest's path and shape, shared with the service that writes it.
lns-session = { path = "../lns-session" }
lns-openshell-spike = { path = "../../spikes/openshell-network" }
lns-policy = { path = "../lns-policy" }
openshell-core = { path = "../../target/openshell/crates/openshell-core", default-features = false }
openshell-supervisor-network = { path = "../../target/openshell/crates/openshell-supervisor-network" }
openshell-supervisor-process = { path = "../../target/openshell/crates/openshell-supervisor-process" }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[dev-dependencies]
serial_test = "3"
lns-policy = { path = "../lns-policy" }
