# Pins the tool-provisioning engine (mise) and everything the disposable
# provisioner guest needs. Users never see or choose these; bump via the
# bump-mise CLI, which verifies upstream's SHASUMS256.txt + minisign signature
# and regenerates src/tools/registry.snapshot from the release's registry/.

[engine]
version = "2026.7.14"

# sha256 of the bare `mise-v<version>-linux-<arch>-musl` release binary — the
# static musl build runs dependency-free on both musl and glibc guests.
[engine.sha256]
aarch64 = "d425bdcad22eacf39081e8762a4a32fba5e32c8fd1c227a73e878f7dbd1fb8bb"
x86_64 = "255506718855e217311886eea44a46d1d213308a55fb37ba664d588889fefefe"

# Provisioner guest base images, one per libc flavor, pinned by the per-arch
# platform manifest digest (the pull verifies the platform manifest it
# receives, not the multi-arch index). The rootfs flavor always matches the
# flavor being provisioned: node/bun/deno execute the installed tool as a
# post-install check.
[provisioner_rootfs.gnu]
aarch64 = "docker.io/library/debian@sha256:9b67294679b30e5d6ab257b40594feeb4a4b81f7fcf4131f4decf0d6a212a9b0"
x86_64 = "docker.io/library/debian@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e"

[provisioner_rootfs.musl]
aarch64 = "docker.io/library/alpine@sha256:45e09956dc667c5eff3583c9d94830261fb1ca0be10a0a7db36266edf5de9e1d"
x86_64 = "docker.io/library/alpine@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e"

# Static curl for the rust backend: rustup's bootstrap hard-requires curl or
# wget with TLS, and busybox wget is not enough.
[static_curl]
version = "8.11.0"

[static_curl.sha256]
aarch64 = "1b050abd1669f9a2ac29b34eb022cdeafb271dce5a4fb57d8ef8fadff6d7be1f"
x86_64 = "d18aa1f4e03b50b649491ca2c401cd8c5e89e72be91ff758952ad2ab5a83135d"

# Alpine v3.20 main apks. ca-certificates-bundle supplies the CA store at the
# canonical /etc/ssl/certs path every slim image lacks (mise ignores
# SSL_CERT_FILE); the rest are the musl companions node/bun need at run time
# (libstdc++/libgcc) and npm's wrapper script needs (bash + its libs).
[[companion]]
name = "ca-certificates-bundle"
version = "20260413-r0"
sha256 = { aarch64 = "52974163f51f4292491578a709b505e0c1ab095ced5eb9398e9303a0aa476cf7", x86_64 = "05965b5144feb571c15d075797a48b19c37f8d06296c639f812569836545f402" }

[[companion]]
name = "libstdc++"
version = "13.2.1_git20240309-r1"
sha256 = { aarch64 = "ee68ab3af02350f2135b6c0de393a55be88fbb20171e6182cdda6517c38b60a0", x86_64 = "af0fe894ef5051116e321bf4753a10fffa85abc2b71f30b2e949467775421ace" }

[[companion]]
