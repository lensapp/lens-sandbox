name: Release

# CDN-write S3 credentials live on the `release` GitHub environment
# (Settings → Environments) rather than as repository secrets, so no
# repo-wide CDN-write credential exists. deploy-lns-install, build-lns,
# and publish-lns-manifest reference it and read S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY, S3_ENDPOINT_URL, and S3_BUCKET from it; its
# required reviewers hold each release run until a human approves the
# CDN write. WARNING: unlike publish-kernel there is no base-ref
# fail-safe here — these jobs READ the secrets, so the environment must
# exist and be populated before this workflow runs on main, or the
# secrets resolve empty and every upload breaks.

on:
  push:
    branches: [main]
  # Manual escape hatch for partial-release-failure recovery. If
  # release-please cut a tag but a downstream upload job failed and
  # "Re-run failed jobs" isn't available (e.g., run expired), an
  # operator can re-trigger the upload work without going through
  # release-please again. See the input descriptions below.
  workflow_dispatch:
    inputs:
      lns_tag:
        description: 'lns tag to (re)build, e.g. lns-v0.13.0'
        required: false
        type: string
      lns_version:
        description: 'lns version, e.g. 0.13.0'
        required: false
        type: string
      lns_install_tag:
        description: 'lns-install tag to redeploy, e.g. lns-install-v0.1.0'
        required: false
        type: string
      force_build_lns:
        description: 'Build + publish lns release binaries (and lns-latest.json) even if release-please did not cut a release in this run'
        type: boolean
        default: false
      force_deploy_install:
        description: 'Re-deploy lns-install.sh to the CDN even if release-please did not cut a release in this run'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      lns-released: ${{ steps.release.outputs['release_created'] }}
      lns-version: ${{ steps.release.outputs['version'] }}
      lns-tag: ${{ steps.release.outputs['tag_name'] }}
      lns-install-released: ${{ steps.release.outputs['scripts/lns-install--release_created'] }}
      lns-install-tag: ${{ steps.release.outputs['scripts/lns-install--tag_name'] }}
      actions-released: ${{ steps.release.outputs['actions--release_created'] }}
      actions-tag: ${{ steps.release.outputs['actions--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Force-move the floating major tag consumers reference
  # (`lensapp/lens-sandbox/actions/setup-lns@lns-actions-v0`) to the release
  # release-please just cut. `contents: write` is all it needs — no CDN
  # credentials, so it stays off the `release` environment and never waits
  # for a reviewer.
  move-actions-major-tag:
    needs: release-please
    if: needs.release-please.outputs.actions-released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.actions-tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.actions-tag }}

      - name: Move lns-actions-v<major> to the new release
        run: |
          set -euo pipefail
          version="${TAG#lns-actions-v}"
          major="${version%%.*}"
          if ! printf '%s' "$major" | grep -qE '^[0-9]+$'; then
            echo "::error::cannot derive a major version from tag '$TAG'."
            exit 1
          fi
          floating="lns-actions-v${major}"
          git tag --force "$floating" "${TAG}^{commit}"
          git push --force origin "refs/tags/${floating}"
          echo "$floating now points at $TAG."

  # Publish scripts/lns-install/lns-install.sh to the get.lns.run CDN.
  # Decoupled from build-lns so the installer (which is version-agnostic
  # — it reads lns-latest.json at runtime) ships independently of CLI
  # releases. Gated on release-please cutting a tag for the install
  # script, so an arbitrary main push doesn't redeploy.
  deploy-lns-install:
    needs: release-please
    if: needs.release-please.outputs.lns-install-released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy_install)
    runs-on: ubuntu-latest
    environment: release
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ inputs.lns_install_tag }}" ]; then
            echo "::error::force_deploy_install requires lns_install_tag input."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Pin to the released tag so the uploaded artifact matches
          # the CHANGELOG entry release-please just cut. On manual
          # dispatch, fall back to the operator-provided tag.
          ref: ${{ needs.release-please.outputs.lns-install-tag || inputs.lns_install_tag }}

      - name: Configure the trusted macOS signing team
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: python3 scripts/configure-macos-signing.py scripts/lns-install/lns-install.sh

      - name: Validate script syntax
        run: bash -n scripts/lns-install/lns-install.sh

      - name: Upload lns-install.sh to CDN origin
        run: |
          set -euo pipefail
          # Uploaded as `lns-install.sh` at the bucket root. The
          # get.lns.run pull zone's edge rule rewrites `/` → `/lns-install.sh`
          # so `curl https://get.lns.run | bash` returns this content.
          #
          # TTLs are controlled by the pull-zone default (~10 min) + an
          # edge rule that overrides versioned artifact patterns to 1 year.
          # We don't pass --cache-control: the storage backend drops it on PUT.
          aws s3 cp scripts/lns-install/lns-install.sh "s3://${S3_BUCKET}/lns-install.sh" \
            --endpoint-url "$S3_ENDPOINT_URL" \
            --content-type "text/x-shellscript"

  # Build lns-cli release binaries for darwin-aarch64, linux-aarch64, and
  # linux-x86_64. Tarball + sha256 are uploaded to the GitHub Release and
  # mirrored to the CDN origin behind get.lns.run.
  #
  # Matrix uses Rust target_arch tokens uniformly (aarch64 / x86_64) — the
  # install script normalises uname -m to match.
  build-lns:
    needs: release-please
    if: needs.release-please.outputs.lns-released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build_lns)
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: darwin
            arch: aarch64
            runner: macos-latest
          # Pinned to 22.04 (glibc 2.35) to set the Linux release glibc floor:
          # the host binaries are dynamic-glibc (lns-service links GTK for the
          # tray, so static-musl is out), making the runner's glibc the floor.
          # The "Enforce glibc baseline" step fails the build if it creeps above
          # 2.35 — don't move these to ubuntu-latest.
          - target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.lns-tag || inputs.lns_tag }}
      VERSION: ${{ needs.release-please.outputs.lns-version || inputs.lns_version }}
      # Pin empty — build.rs treats empty as unset, and the explicit
      # pin denies any org-level env injection a path into the
      # dev-override branch that would ship a 0-byte placeholder.
      LNS_INIT_BIN: ""
      LNS_SESSION_BROKER_BIN: ""
      LNS_NFT_BIN: ""
      LNS_SUPERVISOR_BIN: ""
      # The GitHub OAuth app id (a public device-flow identifier, not a
      # true secret) is baked into the official binary; fork builds ship
      # without it and fall back to a pasted PAT.
      LNS_OAUTH_CLIENT_ID_GITHUB: ${{ secrets.OAUTH_CLIENT_ID_GITHUB }}
      # Google's device flow is a confidential client: its id AND secret
      # are baked into the official binary (extractable, treated as a
      # public client per RFC 8252). Fork builds ship without them and
      # fall back to a pasted token.
      LNS_OAUTH_CLIENT_ID_GOOGLE: ${{ secrets.OAUTH_CLIENT_ID_GOOGLE }}
      LNS_OAUTH_CLIENT_SECRET_GOOGLE: ${{ secrets.OAUTH_CLIENT_SECRET_GOOGLE }}
      # build.rs already defaults to rust-lld; pinning here documents
      # intent and survives an org-level env override that picks a
      # nonexistent toolchain like `aarch64-linux-musl-gcc`.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      # On the x86_64 Linux runner the guests cross-build for
      # x86_64-unknown-linux-musl (build.rs picks the triple from the host
      # arch). cc-rs's default x86_64-linux-musl-gcc isn't installed, so point
      # it at the runner's native gcc/ar; rust-lld links against the musl
      # sysroot. The aarch64 runner ignores these and uses its own toolchain.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_x86_64_unknown_linux_musl: gcc
      AR_x86_64_unknown_linux_musl: ar
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$TAG" ] || [ -z "$VERSION" ]; then
            echo "::error::force_build_lns requires lns_tag and lns_version inputs."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Pin to the released tag so the artifact matches the changelog
          # and the version bumped into Cargo.toml.
          ref: ${{ env.TAG }}

      - name: Install Linux system dependencies (tray-icon / GTK)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install aarch64-musl cross toolchain
        uses: ./.github/actions/install-cross-toolchain

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          # toolchain version + aarch64-unknown-linux-musl come from
          # rust-toolchain.toml. matrix.target is the runner's host
          # triple — already installed by default.
          cache-workspaces: .
          cache-on-failure: true

      - name: Configure the trusted macOS signing team before compiling the updater
        if: matrix.os == 'darwin'
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: python3 scripts/configure-macos-signing.py clients/macos/scripts/install.sh

      - name: Build lns
        # --locked makes the release build hermetic; the cargo-workspace plugin keeps the tag's Cargo.lock in sync.
        run: cargo build --release --locked --target ${{ matrix.target }} -p lns-cli

      - name: Build lns-service
        run: cargo build --release --locked --target ${{ matrix.target }} -p lns-service

      - name: Enforce glibc baseline (Linux only)
        if: matrix.os == 'linux'
        env:
          GLIBC_FLOOR: "2.35"
        run: |
          set -euo pipefail
          check() {
            local bin="$1" max
            max=$(objdump -T "$bin" \
              | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
              | sed 's/GLIBC_//' | sort -V | tail -1)
            if [ -z "$max" ]; then
              echo "::error::$bin exposes no GLIBC_ version symbols; cannot verify the floor"
              exit 1
            fi
            if [ "$(printf '%s\n%s\n' "$max" "$GLIBC_FLOOR" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
              echo "::error::$bin requires glibc $max, above the $GLIBC_FLOOR baseline — would not run on the oldest supported LTS"
              exit 1
            fi
            echo "$bin: max required glibc $max (floor $GLIBC_FLOOR) — OK"
          }
          check "target/${{ matrix.target }}/release/lns"
          check "target/${{ matrix.target }}/release/lns-service"

      - name: Sign and notarize the native macOS app
        if: matrix.os == 'darwin'
        env:
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: sh clients/macos/scripts/ci-release.sh "target/${{ matrix.target }}/release" "$VERSION"

      - name: Package tarball and compute checksum
        id: pkg
        run: |
          set -euo pipefail
          ASSET="lns-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          if [ "${{ matrix.os }}" = darwin ]; then
            ASSET="lns-${VERSION}-darwin-aarch64.zip"
            cp clients/macos/dist/LNS-macos.zip "$ASSET"
          else
            tar czf "$ASSET" -C target/${{ matrix.target }}/release lns lns-service
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          else
            echo "Error: no SHA-256 checksum tool (sha256sum or shasum) found." >&2
            exit 1
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.pkg.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

      - name: Upload to CDN origin
        env:
          ASSET: ${{ steps.pkg.outputs.asset }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Versioned tarball. The install script (scripts/lns-install.sh)
          # reads lns-latest.json to find the newest tarball; each release
          # is reachable at a stable, never-rewritten URL. The pull-zone
          # edge rule pins this URL pattern to 1 year cache. We don't pass
          # --cache-control: the storage backend drops it on PUT.
          CONTENT_TYPE=application/gzip
          if [ "${{ matrix.os }}" = darwin ]; then CONTENT_TYPE=application/zip; fi
          aws s3 cp "$ASSET" "s3://${S3_BUCKET}/${ASSET}" \
            --endpoint-url "$S3_ENDPOINT_URL" \
            --content-type "$CONTENT_TYPE"
          aws s3 cp "$ASSET.sha256" "s3://${S3_BUCKET}/${ASSET}.sha256" \
            --endpoint-url "$S3_ENDPOINT_URL" \
            --content-type "text/plain"

  # Publish lns-latest.json after all build-lns matrix jobs have uploaded
  # their tarballs, so the manifest never points at objects that don't
  # exist yet.
  publish-lns-manifest:
    needs: [release-please, build-lns]
    # Explicit mirror of build-lns's gate. The `needs` cascade already
    # blocks this job when build-lns is skipped, but pinning the same
    # condition here documents intent and survives future refactors.
    if: needs.release-please.outputs.lns-released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build_lns)
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.release-please.outputs.lns-version || inputs.lns_version }}
      TAG: ${{ needs.release-please.outputs.lns-tag || inputs.lns_tag }}
      CDN_BASE: https://get.lns.run
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - name: Build and upload lns-latest.json
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          # Read each platform's sha256 back from the objects build-lns
          # just uploaded — the storage backend is the source of truth, so
          # the manifest is guaranteed to match what's actually published.
          get_sha() {
            local os="$1" arch="$2"
            local extension=tar.gz
            if [ "$os" = darwin ]; then extension=zip; fi
            local key="lns-${VERSION}-${os}-${arch}.${extension}.sha256"
            aws s3 cp "s3://${S3_BUCKET}/${key}" "${tmp}/${os}-${arch}.sha256" \
              --endpoint-url "$S3_ENDPOINT_URL" >/dev/null
            awk '{print $1}' "${tmp}/${os}-${arch}.sha256"
          }
          DARWIN_AARCH64_SHA=$(get_sha darwin aarch64)
          LINUX_AARCH64_SHA=$(get_sha linux aarch64)
          LINUX_X86_64_SHA=$(get_sha linux x86_64)
          cat > "${tmp}/lns-latest.json" <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${CDN_BASE}/lns-${VERSION}-darwin-aarch64.zip",
                "sha256": "${DARWIN_AARCH64_SHA}"
              },
              "linux-aarch64": {
                "url": "${CDN_BASE}/lns-${VERSION}-linux-aarch64.tar.gz",
                "sha256": "${LINUX_AARCH64_SHA}"
              },
              "linux-x86_64": {
                "url": "${CDN_BASE}/lns-${VERSION}-linux-x86_64.tar.gz",
                "sha256": "${LINUX_X86_64_SHA}"
              }
            }
          }
          EOF
          # Short TTL is enforced by the pull-zone default (~10 min); we
          # don't pass --cache-control because the storage backend drops it on PUT.
          aws s3 cp "${tmp}/lns-latest.json" "s3://${S3_BUCKET}/lns-latest.json" \
            --endpoint-url "$S3_ENDPOINT_URL" \
            --content-type "application/json"
