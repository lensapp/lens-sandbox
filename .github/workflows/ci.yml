name: CI

on:
  pull_request:
    # Label-only events must never re-report `CI / check` (they'd supersede a
    # failing run with all-skipped green); the label gate lives in pr-labels.yml.
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  # Path-change detector. When a PR/push touches only docs, runbooks, or
  # other non-code paths, downstream heavy jobs (lint/test/coverage) skip
  # via `if:` and the aggregate `check` job below treats `skipped` as OK.
  #
  # Previously the workflow used a top-level `paths-ignore` to skip CI
  # entirely for docs-only PRs. That left such PRs stuck in BLOCKED
  # forever because branch protection requires `CI / check` to report,
  # and a workflow that doesn't trigger never reports anything.
  #
  # The detector runs on every PR/push so `check` always reports.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      check-release-build: ${{ steps.filter.outputs['check-release-build'] }}
      static-nft: ${{ steps.filter.outputs['static-nft'] }}
      shell: ${{ steps.filter.outputs.shell }}
      actions: ${{ steps.filter.outputs.actions }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          # `code` excludes docs/runbooks/markdown (last matching pattern wins).
          # `check-release-build` gates the same-named job to paths that
          # affect the shipping chain — embedded guest payloads, codesign,
          # manifests.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!runbooks/**'
              - '!**.md'
            check-release-build:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'rust-toolchain.toml'
              - 'crates/lns-init/**'
              - 'crates/lns-session-broker/**'
              - 'crates/lns-session/**'
              - 'crates/lns-service/Cargo.toml'
              - 'crates/lns-service/build.rs'
              - 'crates/lns-cli/Cargo.toml'
              - 'crates/lns-cli/lns.entitlements'
              - 'crates/lns-cli/scripts/**'
              - '.github/workflows/release-please.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/install-cross-toolchain/**'
              - 'scripts/lns-install/**'
              - 'scripts/lns-cli.sh'
            shell:
              - 'scripts/*.sh'
              - 'scripts/hooks/**'
              - 'actions/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            actions:
              - 'actions/**'
              - 'crates/lns-cli/**'
              - '.github/workflows/ci.yml'
            static-nft:
              - 'vendor/static-nft/**'
              - 'scripts/static-nft.Dockerfile'
              - 'scripts/build-static-nft.sh'
              - 'scripts/verify-static-nft.sh'

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux system dependencies (tray-icon / GTK)
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          # Per-job cache-shared-key so lint/test/coverage don't fight
          # for the same target/ slot. `make complexity` nests its own dir
          # inside target/, which rust-cache stores with the rest.
          cache-workspaces: .
          cache-on-failure: true
          cache-shared-key: lns-ci-lint

      - run: CARGO_LOCKED=--locked make lint
      - run: make complexity

  # `make lint` runs the shell harnesses on Linux. They also run on a
  # contributor's mac, where /bin/sh and the BSD userland differ — so they
  # run here too, on the OS that would otherwise find out last. No cargo
  # build, but the toolchain is set up: the Makefile's globals read `cargo
  # metadata`, and affected-crates' fixtures drive the real thing.
  shell-tests-macos:
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
      - run: make shell-tests

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need history back to PR base to detect kernels.toml drift
          # — drives the --allow-pending decision below.
          fetch-depth: 0

      - name: Install Linux system dependencies (tray-icon / GTK)
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspaces: .
          cache-on-failure: true
          cache-shared-key: lns-ci-test

      - run: CARGO_LOCKED=--locked make test
      - run: make e2e

      - name: Verify kernel pins match CDN
        # Strict on push/schedule. On a PR that modifies kernels.toml the
        # new SHAs aren't on the CDN until merge-time publish, so we
        # tolerate 404 / empty-sha via --allow-pending. Mismatches always
        # hard-fail.
        run: |
          set -euo pipefail
          ALLOW=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            if ! git diff --quiet "$BASE" -- crates/lns-service/kernels.toml; then
              echo "kernels.toml differs from PR base — drift check will tolerate pending publish."
              ALLOW="--allow-pending"
            fi
          fi
          scripts/check-kernel-pins.sh $ALLOW

  coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need history back to the PR base so scripts/affected-crates.sh
          # can compute the merge-base for the affected-crates filter.
          # On `push: main`, this is unused (full workspace runs anyway).
          fetch-depth: 0

      - name: Install Linux system dependencies (tray-icon / GTK)
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          # Coverage uses target/llvm-cov-target/ — Makefile owns the
          # path (COVERAGE_TARGET_DIR). Cache key matches its layout.
          cache-workspaces: |
            . -> target/llvm-cov-target
          # The stamp that decides profraw-only vs full clean. rust-cache
          # strips loose files from a cached target root, so it lives here.
          cache-directories: .gate
          cache-on-failure: true
          cache-shared-key: lns-ci-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@28ba36d36bfc4814f98a469ff9f76b2a41e9aa8a # cargo-llvm-cov tool tag @ 2026-06-03

      - run: rustup component add llvm-tools-preview

      # On pull_request, narrow coverage to crates affected by this PR's
      # diff against its base (incl. reverse-dep closure). On push: main,
      # this step is skipped and full workspace coverage runs unchanged.
      # See scripts/affected-crates.sh for the three-sentinel contract:
      #   __FULL__ -> infra-level change, full workspace required
      #   __NONE__ -> docs/CI-only, skip coverage entirely
      #   <list>   -> newline-separated crate names to instrument
      - name: Compute affected crates
        if: github.event_name == 'pull_request'
        id: affected
        run: |
          set -euo pipefail
          out=$(scripts/affected-crates.sh "${{ github.event.pull_request.base.sha }}")
          if [ "$out" = "__NONE__" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "crates="    >> "$GITHUB_OUTPUT"
          elif [ "$out" = "__FULL__" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "crates="    >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo 'crates<<EOF'
              echo "$out"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage (skipped — no crates affected)
        if: github.event_name == 'pull_request' && steps.affected.outputs.skip == 'true'
        run: echo "No crates affected by this PR's diff — coverage skipped."

      - name: Run coverage
        if: github.event_name != 'pull_request' || steps.affected.outputs.skip != 'true'
        run: make coverage
        env:
          # Empty on push: main and on __FULL__ PRs => Makefile runs full
          # workspace. Non-empty on per-crate PRs => Makefile narrows the
          # cargo invocation and the floor loop. See COVERAGE_CRATES in
          # the Makefile.
          COVERAGE_CRATES: ${{ steps.affected.outputs.crates }}

      # The floor output names the failing file but not the uncovered
      # lines; when the failure doesn't reproduce on a macOS dev host the
      # Linux lcov is the only way to see which DA lines went to zero.
      - name: Upload lcov on coverage failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: target/llvm-cov-target/llvm-cov/lcov.info

  # The runner is non-root, so nothing here would notice a test that only
  # passes as uid 0 — the class that cost seven tests. A container job runs
  # as root, and `make coverage` ends in the parity pass that re-runs every
  # test binary as an unprivileged user. Between the two, both uids are
  # exercised on every PR.
  coverage-as-root:
    runs-on: ubuntu-latest
    container: rust:1.97.1
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Same reason as the coverage job: affected-crates.sh needs the
          # merge-base with the PR's base.
          fetch-depth: 0

      - name: Install system dependencies (tray-icon / GTK, jq, setpriv)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev jq util-linux

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspaces: |
            . -> target/llvm-cov-target
          cache-directories: .gate
          cache-on-failure: true
          cache-shared-key: lns-ci-coverage-root

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@28ba36d36bfc4814f98a469ff9f76b2a41e9aa8a # cargo-llvm-cov tool tag @ 2026-06-03

      - run: rustup component add llvm-tools-preview

      # Narrowed exactly like the non-root coverage job, so a PR is never
      # blocked by the floor on a crate its diff does not touch.
      - name: Compute affected crates
        if: github.event_name == 'pull_request'
        id: affected
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          out=$(scripts/affected-crates.sh "${{ github.event.pull_request.base.sha }}")
          if [ "$out" = "__NONE__" ]; then
            echo "skip=true"  >> "$GITHUB_OUTPUT"
            echo "crates="    >> "$GITHUB_OUTPUT"
          elif [ "$out" = "__FULL__" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "crates="    >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            {
              echo 'crates<<EOF'
              echo "$out"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage as root (skipped — no crates affected)
        if: github.event_name == 'pull_request' && steps.affected.outputs.skip == 'true'
        run: echo "No crates affected by this PR's diff — coverage skipped."

      - name: Run coverage as root
        if: github.event_name != 'pull_request' || steps.affected.outputs.skip != 'true'
        run: make coverage
        env:
          COVERAGE_CRATES: ${{ steps.affected.outputs.crates }}

  # Fails the build on any RUSTSEC advisory against the locked graph so
  # future transitive vulns surface in CI rather than at release time.
  audit:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspaces: .
          cache-on-failure: true
          cache-shared-key: lns-ci-audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@28ba36d36bfc4814f98a469ff9f76b2a41e9aa8a # @ 2026-06-03
        with:
          tool: cargo-audit

      - run: make audit

  # `make build` with real cross-builds + codesign — what the gate's
  # debug-profile embed skip doesn't validate. Env pins mirror release-please.yml.
  check-release-build:
    needs: changes
    if: needs.changes.outputs['check-release-build'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: darwin
    runs-on: ${{ matrix.runner }}
    env:
      LNS_INIT_BIN: ""
      LNS_SESSION_BROKER_BIN: ""
      LNS_NFT_BIN: ""
      LNS_SUPERVISOR_BIN: ""
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
      AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
      # The x86_64 Linux runner cross-builds the guest payloads for
      # x86_64-unknown-linux-musl (build.rs derives the guest triple from the
      # host arch). The runner's native gcc/ar emit relocatable x86_64 objects
      # for the C deps (aws-lc-sys / ring); rust-lld does the final static link
      # against the Rust musl sysroot — same arrangement as the aarch64 path.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_x86_64_unknown_linux_musl: gcc
      AR_x86_64_unknown_linux_musl: ar

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux system dependencies (tray-icon / GTK)
        if: matrix.os == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 # v1.6.0
        with:
          packages: libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - name: Install aarch64-musl cross toolchain
        uses: ./.github/actions/install-cross-toolchain

      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache-workspaces: .
          cache-on-failure: true
          cache-shared-key: lns-ci-check-release-build-${{ matrix.os }}

      - run: CARGO_LOCKED=--locked make build

  # Re-derive the embedded static nft from sha-pinned source and prove the
  # committed vendor/static-nft/ blob is byte-identical to a fresh build, so a
  # blob swap can't pass review-blind. Gated to the rare PRs that touch the
  # blob or its pinned source (Dockerfile / build script); build.rs's own sha
  # pin is validated against the blob by check-release-build.
  verify-static-nft:
    needs: changes
    if: needs.changes.outputs['static-nft'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - run: scripts/verify-static-nft.sh ${{ matrix.platform }}

  # The composite actions under actions/, run from the checkout on both
  # runner families. Each install is the real thing: a release tarball from
  # this repository, its .sha256 verified, `lns` on PATH.
  actions:
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    # Step-level `if:` cannot read `secrets`, so the staging self-test gates
    # on these; unset in a fork, the steps skip.
    env:
      LNS_HUB_STAGING_TOKEN: ${{ secrets.LNS_HUB_STAGING_TOKEN }}
      LNS_HUB_STAGING_NAMESPACE: ${{ vars.LNS_HUB_STAGING_NAMESPACE || secrets.LNS_HUB_STAGING_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup-lns (newest release)
        id: latest
        uses: ./actions/setup-lns
        with:
          version: latest

      - name: The newest release runs and validates a document
        env:
          REPORTED: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          lns --version
          if [ -z "$REPORTED" ]; then
            echo "::error::setup-lns reported no version."
            exit 1
          fi
          if [ "$(lns --version | awk '{print $NF}')" != "$REPORTED" ]; then
            echo "::error::lns on PATH is not the version setup-lns reported ($REPORTED)."
            exit 1
          fi
          lns artifact validate -f docs/examples/claude-code/lns.yaml

      - name: setup-lns (pinned release)
        id: pinned
        uses: ./actions/setup-lns
        with:
          version: 0.25.0

      - name: The pinned release runs, validates a document, and brings no service
        env:
          REPORTED: ${{ steps.pinned.outputs.version }}
        run: |
          set -euo pipefail
          lns --version
          if [ "$REPORTED" != "0.25.0" ] || [ "$(lns --version | awk '{print $NF}')" != "0.25.0" ]; then
            echo "::error::pinned install is not 0.25.0 (reported '$REPORTED')."
            exit 1
          fi
          lns artifact validate -f docs/examples/claude-code/lns.yaml
          if [ -e "$(dirname "$(command -v lns)")/lns-service" ]; then
            echo "::error::setup-lns installed lns-service; it must extract lns only."
            exit 1
          fi

      # lns-login / lns-logout against a host that cannot resolve: what they
      # pin is the file `lns artifact push` reads, not a round trip. The
      # runner has no lns-service, so this is the file fallback's own test.
      - name: Another host is already logged in
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.lns"
          printf '{"other.example.invalid":{"username":"keep","secret":"keep-me"}}' \
            >"$HOME/.lns/registry-auth.json"
          chmod 0600 "$HOME/.lns/registry-auth.json"
          jq -e 'keys == ["other.example.invalid"]' "$HOME/.lns/registry-auth.json" >/dev/null

      - name: lns-login (example.invalid)
        uses: ./actions/lns-login
        with:
          registry: example.invalid
          username: ci
          password: not-a-real-token

      - name: The login added one entry, 0600, and touched no other host
        env:
          EXPECTED_SECRET: not-a-real-token
        run: |
          set -euo pipefail
          file="$HOME/.lns/registry-auth.json"
          if [ -z "$(find "$file" -perm 600)" ]; then
            echo "::error::registry-auth.json is not 0600."
            ls -l "$file"
            exit 1
          fi
          jq -e '
            (keys | sort) == ["example.invalid", "other.example.invalid"]
            and .["example.invalid"].username == "ci"
            and .["example.invalid"].secret == $ENV.EXPECTED_SECRET
            and .["other.example.invalid"].secret == "keep-me"
          ' "$file" >/dev/null

      - name: lns-logout (example.invalid)
        uses: ./actions/lns-logout
        with:
          registry: example.invalid

      - name: The logout removed that entry and left the other one
        run: |
          set -euo pipefail
          file="$HOME/.lns/registry-auth.json"
          if [ -z "$(find "$file" -perm 600)" ]; then
            echo "::error::registry-auth.json is not 0600."
            ls -l "$file"
            exit 1
          fi
          jq -e '
            keys == ["other.example.invalid"]
            and .["other.example.invalid"].secret == "keep-me"
          ' "$file" >/dev/null

      - name: lns-push (sandbox fixture, dry run)
        id: dry-sandbox
        uses: ./actions/lns-push
        with:
          file: actions/lns-push/fixtures/sandbox.yaml
          kind: sandbox
          tags: |
            lns-ci/actions-sandbox-fixture:sha-${{ github.sha }}
            lns-ci/actions-sandbox-fixture:ci
          push: false

      - name: lns-push (mixin fixture, dry run)
        id: dry-mixin
        uses: ./actions/lns-push
        with:
          file: actions/lns-push/fixtures/mixin.yaml
          kind: mixin
          tags: lns-ci/actions-mixin-fixture:sha-${{ github.sha }}
          push: false

      - name: A dry run publishes nothing
        env:
          SANDBOX_DIGEST: ${{ steps.dry-sandbox.outputs.digest }}
          SANDBOX_REFS: ${{ steps.dry-sandbox.outputs.refs }}
          MIXIN_DIGEST: ${{ steps.dry-mixin.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -n "$SANDBOX_DIGEST" ] || [ -n "$SANDBOX_REFS" ] || [ -n "$MIXIN_DIGEST" ]; then
            echo "::error::push: false reported a digest or a ref."
            exit 1
          fi

      # The one real publish: main only, ubuntu only, and only once a person
      # has stored the staging credentials (issue #398).
      - name: lns-login (hub.staging.lns.run)
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && matrix.runner == 'ubuntu-latest' && env.LNS_HUB_STAGING_TOKEN != ''
        uses: ./actions/lns-login
        with:
          registry: hub.staging.lns.run
          username: ${{ secrets.LNS_HUB_STAGING_USERNAME }}
          password: ${{ secrets.LNS_HUB_STAGING_TOKEN }}

      - name: lns-push (mixin fixture to hub.staging.lns.run)
        id: staging
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && matrix.runner == 'ubuntu-latest' && env.LNS_HUB_STAGING_TOKEN != ''
        uses: ./actions/lns-push
        with:
          file: actions/lns-push/fixtures/mixin.yaml
          kind: mixin
          tags: hub.staging.lns.run/${{ env.LNS_HUB_STAGING_NAMESPACE }}/ci-fixture:sha-${{ github.sha }}

      - name: The staging push reported a digest
        if: steps.staging.outcome == 'success'
        env:
          DIGEST: ${{ steps.staging.outputs.digest }}
          REFS: ${{ steps.staging.outputs.refs }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) : ;;
            *) echo "::error::the staging push reported digest '$DIGEST'."; exit 1 ;;
          esac
          printf '%s\n' "$REFS"

      - name: lns-logout (hub.staging.lns.run)
        if: always() && steps.staging.outcome != 'skipped'
        uses: ./actions/lns-logout
        with:
          registry: hub.staging.lns.run

      # ci.yml publishes no lns build artifact, so the `binary` input is
      # exercised against a stand-in executable: what it pins is that the
      # input skips the download entirely and still puts the named binary
      # on PATH.
      - name: Write a stand-in lns
        if: matrix.runner == 'ubuntu-latest'
        run: |
          set -euo pipefail
          printf '#!/usr/bin/env bash\necho "lns 9.9.9-ci-stub"\n' > .ci-stub-lns
          chmod +x .ci-stub-lns

      - name: setup-lns (prebuilt binary, no download)
        if: matrix.runner == 'ubuntu-latest'
        id: prebuilt
        uses: ./actions/setup-lns
        with:
          binary: ${{ github.workspace }}/.ci-stub-lns

      - name: The prebuilt binary is the one on PATH
        if: matrix.runner == 'ubuntu-latest'
        env:
          REPORTED: ${{ steps.prebuilt.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$REPORTED" != "9.9.9-ci-stub" ] || [ "$(lns --version | awk '{print $NF}')" != "9.9.9-ci-stub" ]; then
            echo "::error::the binary input did not put the named binary on PATH (reported '$REPORTED')."
            exit 1
          fi

  # Aggregate gate — single required status check on `main` branch
  # protection. Lets us split/rename the underlying jobs without
  # touching branch protection. Treats `skipped` as OK so docs-only PRs
  # (where the `changes` detector skips lint/test/coverage) still report
  # a green `check` and unblock the PR; a failed `changes` job still
  # hard-fails so we don't accidentally green-light real code changes.
  check:
    runs-on: ubuntu-latest
    needs: [changes, lint, shell-tests-macos, test, coverage, coverage-as-root, audit, check-release-build, verify-static-nft, actions]
    if: always()
    steps:
      - name: Verify all gates passed
        run: |
          ok() {
            # Pass if success, or skipped (path-filtered jobs skip on
            # docs-only / release-irrelevant PRs).
            [ "$1" = "success" ] || [ "$1" = "skipped" ]
          }
          if ! ok "${{ needs.lint.result }}" \
            || ! ok "${{ needs['shell-tests-macos'].result }}" \
            || ! ok "${{ needs.test.result }}" \
            || ! ok "${{ needs.coverage.result }}" \
            || ! ok "${{ needs['coverage-as-root'].result }}" \
            || ! ok "${{ needs.audit.result }}" \
            || ! ok "${{ needs.check-release-build.result }}" \
            || ! ok "${{ needs.verify-static-nft.result }}" \
            || ! ok "${{ needs.actions.result }}"; then
            echo "One or more gates failed: lint=${{ needs.lint.result }} shell-tests-macos=${{ needs['shell-tests-macos'].result }} test=${{ needs.test.result }} coverage=${{ needs.coverage.result }} coverage-as-root=${{ needs['coverage-as-root'].result }} audit=${{ needs.audit.result }} check-release-build=${{ needs.check-release-build.result }} verify-static-nft=${{ needs.verify-static-nft.result }} actions=${{ needs.actions.result }}"
            exit 1
          fi
          # Guard against the changes detector itself failing (e.g.
          # paths-filter network issue) — without this, a failed
          # `changes` job would silently skip every downstream job and
          # check would pass.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Changes detector failed: changes=${{ needs.changes.result }}"
            exit 1
          fi
          echo "All gates passed (lint=${{ needs.lint.result }} shell-tests-macos=${{ needs['shell-tests-macos'].result }} test=${{ needs.test.result }} coverage=${{ needs.coverage.result }} audit=${{ needs.audit.result }} check-release-build=${{ needs.check-release-build.result }} actions=${{ needs.actions.result }})."
