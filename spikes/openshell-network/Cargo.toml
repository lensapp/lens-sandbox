[package]
name = "lns-openshell-spike"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "admission-probe"
path = "src/main.rs"

[[example]]
name = "dns-boundary"
path = "../../crates/e2e-tests/probes/openshell-dns.rs"

[workspace]

[features]
host-approval = ["dep:lns-service"]

[dependencies]
hickory-proto = "0.26.1"
lns-policy = { path = "../../crates/lns-policy" }
lns-service = { path = "../../crates/lns-service", optional = true }
openshell-core = { path = "../../target/openshell/crates/openshell-core", default-features = false }
openshell-supervisor-network = { path = "../../target/openshell/crates/openshell-supervisor-network", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
openshell-supervisor-process = { path = "../../target/openshell/crates/openshell-supervisor-process" }
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
